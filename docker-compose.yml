version: '3.8'

services:
  db:
    image: postgres:15

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fernanda_marketing}
      POSTGRES_USER: ${POSTGRES_USER:-fernanda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fernanda}"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile

    environment:
      AUTH_DB_URL: postgresql://${POSTGRES_USER:-fernanda}:${POSTGRES_PASSWORD:-supersecret}@db:5432/${POSTGRES_DB:-fernanda_marketing}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-change_this_secret}
      AUTH_JWT_ALGORITHM: ${AUTH_JWT_ALGORITHM:-HS256}
      AUTH_ACCESS_TOKEN_EXPIRE: ${AUTH_ACCESS_TOKEN_EXPIRE:-60}
    ports:
      - "8101:8101"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8101/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  opportunity-service:
    build:
      context: ./backend
      dockerfile: opportunity-service/Dockerfile

    environment:
      OPPORTUNITY_DB_URL: postgresql://${POSTGRES_USER:-fernanda}:${POSTGRES_PASSWORD:-supersecret}@db:5432/${POSTGRES_DB:-fernanda_marketing}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-change_this_secret}
      AUTH_JWT_ALGORITHM: ${AUTH_JWT_ALGORITHM:-HS256}
      AUTH_ACCESS_TOKEN_EXPIRE: ${AUTH_ACCESS_TOKEN_EXPIRE:-60}
    ports:
      - "8102:8102"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8102/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    environment:
      VITE_API_URL: http://localhost:8101
      VITE_OPPORTUNITY_SERVICE_URL: http://localhost:8102
    ports:
      - "3010:3010"
    depends_on:
      - auth-service
      - opportunity-service

volumes:
  postgres_data: